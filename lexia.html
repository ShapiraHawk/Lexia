/* --- sentence: timed silent/oral read, then one comprehension question --- */
function runSentence(host, done){
  const t=T();
  SESS && (SESS.seenSent = SESS.seenSent || new Set());
  let sent, guard=0;
  do{ sent = genSentence(); guard++; }
  while(SESS && SESS.seenSent.has(sent.text) && guard<25);
  SESS && SESS.seenSent.add(sent.text);
  const g = genQuestion(sent);
  const choices = shuffle([g.answer, ...g.wrong]);
  const item = {t:sent.text, q:g.q, a:choices, c:choices.indexOf(g.answer)};
  const box=el("div",{});
  host.appendChild(box);
  let t0=0;
  const phase1=()=>{
    box.innerHTML="";
    box.appendChild(el("p",{class:"eyebrow center"}, t.read_aloud));
    const slb=listenBtn(t.read_aloud,{compact:true});
    if(slb) box.appendChild(el("div",{class:"listenrow",style:"justify-content:center"}, slb));
    announceOnce("sent", t.read_aloud);
    const p=el("div",{class:"passage"}, el("p",{}, item.t));
    box.appendChild(p);
    t0=performance.now();
    box.appendChild(el("button",{class:"btn", onClick:phase2}, t.done_reading));
  };
  const phase2=()=>{
    const rt=performance.now()-t0;
    box.innerHTML="";
    box.appendChild(el("p",{class:"eyebrow center"}, t.comp_q));
    box.appendChild(el("p",{class:"center big"}, item.q));
    const qlb=listenBtn(item.q,{compact:true});
    if(qlb) box.appendChild(el("div",{class:"listenrow",style:"justify-content:center"}, qlb));
    const opts=shuffle(item.a.map((a,i)=>({a,i})));
    const g=el("div",{class:"choices"});
    opts.forEach(o=>{
      g.appendChild(el("button",{class:"choice wide", onClick:e=>{
        const ok=o.i===item.c;
        [...g.children].forEach(c=>c.disabled=true);
        e.currentTarget.classList.add(ok?"correct":"wrong");
        const words=item.t.split(/\s+/).filter(Boolean).length;
        recordWpm(words, rt/1000, "sentence", 1);
        L().compHistory.push({t:Date.now(), pct: ok?1:0});
        logTrial({kind:"sentence", item:item.t.slice(0,14), ok, rt:Math.round(rt)});
        saveState(); later(done, ok?450:1000);
      }}, o.a));
    });
    box.appendChild(g);
  };
  phase1();
}

/* --- Multiple Oral Re-reading. The same passage stays assigned across
       sessions; two reads per session; comprehension after the second. --- */
function runMor(host, done){
  const t=T(), st=L();
  if(!st.genPassages) st.genPassages=[];
  const bank=[...C().passages, ...st.genPassages.filter(p=>p.lang===S.lang)];
  const counts = bank.map(p=>st.passageReads[p.id]||0);
  let idx = counts.findIndex(c=>c<10);
  let P;
  if(idx<0){
    P = genPassage(); P.lang=S.lang;
    st.genPassages.push(P);
    if(st.genPassages.length>12) st.genPassages.shift();
    saveState();
  } else P = bank[idx];
  let readNo = (st.passageReads[P.id]||0);
  let reads = 0, times=[];
  const box=el("div",{}); host.appendChild(box);

  const intro=()=>{
    box.innerHTML="";
    box.appendChild(el("p",{class:"eyebrow center"}, `${t.ex_mor} · ${P.title}`));
    box.appendChild(el("p",{class:"center muted"}, `${t.read_n} ${readNo+reads+1}`));
    box.appendChild(el("div",{class:"note"}, isHe()
      ? "אותו קטע, שוב ושוב. זו השיטה עם התמיכה המחקרית הטובה ביותר שיש כרגע — ורוב התועלת מגיעה מהמילים שחוזרות."
      : "The same passage, again and again. This is the best-supported method available — and most of the benefit comes from the words that repeat."));
    const mlb=listenBtn(t.ex_mor+". "+(isHe()
      ? "אותו קטע, שוב ושוב. קראו אותו בקול, בקצב שלכם."
      : "The same passage, again and again. Read it aloud, at your own pace."));
    if(mlb) box.appendChild(el("div",{class:"listenrow"}, mlb));
    box.appendChild(el("button",{class:"btn", onClick:read}, t.start_reading));
  };
  const read=()=>{
    box.innerHTML="";
    box.appendChild(el("p",{class:"eyebrow center"}, `${t.read_n} ${readNo+reads+1} · ${t.read_aloud}`));
    const p=el("div",{class:"passage"});
    P.body.forEach(par=>p.appendChild(el("p",{},par)));
    box.appendChild(p);
    const t0=performance.now();
    const clock=el("div",{class:"timer center",style:"margin-bottom:12px"},"0:00");
    box.appendChild(clock);
    const iv=setInterval(()=>{ clock.textContent=fmtT((performance.now()-t0)/1000); },500);
    TIMERS.push(iv);
    box.appendChild(el("button",{class:"btn", onClick:()=>{
      clearInterval(iv);
      const sec=(performance.now()-t0)/1000;
      const words=P.body.join(" ").split(/\s+/).filter(Boolean).length;
      reads++;
      const wpm=recordWpm(words, sec, P.id, readNo+reads);
      times.push(wpm);
      st.passageReads[P.id]=(st.passageReads[P.id]||0)+1;
      logTrial({kind:"mor", item:P.id, ok:true, rt:Math.round(sec*1000)});
      saveState();
      if(reads<2) between(wpm); else quiz();
    }}, t.done_reading));
  };
  const between=(wpm)=>{
    box.innerHTML="";
    if(wpm===null){
      box.appendChild(el("h3",{class:"center"}, t.too_fast));
      box.appendChild(el("p",{class:"center muted"}, t.too_fast_sub));
      box.appendChild(el("button",{class:"btn",style:"margin-top:16px", onClick:read}, t.start_reading));
      return;
    }
    box.appendChild(el("h2",{class:"center"}, Math.round(wpm)+" "+t.wpm));
    const prev = st.wpmHistory.filter(x=>x.id===P.id).slice(-3,-1);
    if(prev.length) box.appendChild(el("p",{class:"center muted"},
      isHe()? `בקריאה הקודמת של הקטע הזה: ${Math.round(prev[prev.length-1].wpm)}`
            : `Last time you read this passage: ${Math.round(prev[prev.length-1].wpm)}`));
    box.appendChild(el("button",{class:"btn",style:"margin-top:16px", onClick:read}, t.start_reading));
  };
  const quiz=()=>{
    const q=rnd(P.q);
    box.innerHTML="";
    box.appendChild(el("p",{class:"eyebrow center"}, t.comp_q));
    box.appendChild(el("p",{class:"center big"}, q.q));
    const mqlb=listenBtn(q.q,{compact:true});
    if(mqlb) box.appendChild(el("div",{class:"listenrow",style:"justify-content:center"}, mqlb));
    const opts=shuffle(q.a.map((a,i)=>({a,i})));
    const g=el("div",{class:"choices"});
    opts.forEach(o=>{
      g.appendChild(el("button",{class:"choice wide", onClick:e=>{
        const ok=o.i===q.c;
        [...g.children].forEach(c=>c.disabled=true);
        e.currentTarget.classList.add(ok?"correct":"wrong");
        st.compHistory.push({t:Date.now(), pct: ok?1:0});
        saveState(); later(done, 700);
      }}, o.a));
    });
    box.appendChild(g);
  };
  intro();
}

/* --- stage 5: read your own text, untimed --- */
function runReal(host, done){
  const t=T(), st=L();
  if(!st.library.length){
    host.appendChild(el("div",{class:"note"}, t.empty_lib));
    host.appendChild(el("button",{class:"btn", onClick:()=>{ close(); open(libraryScreen); }}, t.read_something));
    host.appendChild(el("div",{style:"height:10px"}));
    host.appendChild(el("button",{class:"btn ghost", onClick:done}, t.next));
    return;
  }
  const item = rnd(st.library);
  host.appendChild(el("p",{class:"eyebrow center"}, t.free_read));
  const p=el("div",{class:"passage"});
  item.text.split(/\n+/).forEach(par=>p.appendChild(el("p",{},par)));
  host.appendChild(p);
  const t0=performance.now();
  host.appendChild(el("button",{class:"btn", onClick:()=>{
    const sec=(performance.now()-t0)/1000;
    const words=item.text.split(/\s+/).filter(Boolean).length;
    recordWpm(words, sec, "real", 1);
    logTrial({kind:"real", item:"library", ok:true, rt:Math.round(sec*1000)});
    saveState(); done();
  }}, t.done_reading));
}

/* ============================================================
   ASSESSMENT — the word-length probe
   A word appears and stays. The person presses the moment they
   have read it; that latency, regressed on letter count, is the
   slope that characterises letter-by-letter reading.
   ============================================================ */
let ASS=null;
function assessmentScreen(){
  const t=T();
  const w=el("div",{class:"screen",style:"padding-top:18px"});
  if(!ASS){
    w.appendChild(el("button",{class:"iconbtn","aria-label":t.back, onClick:()=>{ASS=null;close();}},"✕"));
    w.appendChild(el("h2",{style:"margin-top:14px"},t.as_title));
    w.appendChild(el("p",{},t.as_intro));
    const lr=listenRow(t.as_title+". "+t.as_intro); if(lr) w.appendChild(lr);
    announce(t.as_intro);
    w.appendChild(el("div",{class:"note"}, isHe()
      ? "המספר שיצא בסוף הוא לא ציון. הוא נקודת ההשוואה שלכם לעצמכם בעוד חודש."
      : "The number at the end is not a score. It is your comparison point against yourself in a month."));
    w.appendChild(el("button",{class:"btn", onClick:()=>{
      const lens=[3,4,5,6,7,8];
      const trials=[];
      lens.forEach(n=>{ shuffle(C().probeWords[n]).slice(0,4).forEach(word=>trials.push({word,len:[...word].length})); });
      ASS={phase:"probe", i:0, trials:shuffle(trials), rows:[], wpm:null};
      open(assessmentScreen);
    }}, t.as_begin));
    return w;
  }
  if(ASS.phase==="probe") return probePhase(w);
  if(ASS.phase==="passage") return passagePhase(w);
  return resultPhase(w);
}
function probePhase(w){
  const t=T(), a=ASS;
  if(a.i>=a.trials.length){ a.phase="passage"; return assessmentScreen(); }
  const tr=a.trials[a.i];
  w.appendChild(el("p",{class:"eyebrow"}, `${t.as_running} ${a.i+1} / ${a.trials.length}`));
  const bar=el("div",{class:"sessbar",style:"margin-bottom:14px"});
  a.trials.forEach((_,i)=>bar.appendChild(el("i",{class: i<a.i?"done": i===a.i?"now":""})));
  w.appendChild(bar);
  const stage=makeStage(); w.appendChild(stage);
  const host=el("div",{}); w.appendChild(host);
  const inner=stage._in;
  inner.appendChild(el("div",{class:"fixation"},"+"));
  later(()=>{
    inner.innerHTML="";
    inner.appendChild(el("div",{class:"stim word"}, displayWord(tr.word)));
    const onset=performance.now();
    const btn=el("button",{class:"btn",style:"min-height:76px;font-size:21px", onClick:()=>{
      const rt=performance.now()-onset;
      inner.innerHTML=""; host.innerHTML="";
      host.appendChild(el("p",{class:"muted center"},t.which_word));
      const opts=shuffle([tr.word, ...wordDistractors(tr.word,3)]).map(displayWord);
      host.appendChild(choiceGrid(opts, displayWord(tr.word), (pick,ok)=>{
        a.rows.push({len:tr.len, rt, ok, word:tr.word});
        a.i++; open(assessmentScreen);
      }));
    }}, t.ive_read);
    host.appendChild(btn);
  }, 520);
  return w;
}
function passagePhase(w){
  const t=T(), a=ASS, P=C().probePassage;
  w.appendChild(el("h2",{},t.as_read_title));
  w.appendChild(el("p",{},t.as_read_intro));
  const lr2=listenRow(t.as_read_title+". "+t.as_read_intro); if(lr2) w.appendChild(lr2);
  announce(t.as_read_intro);
  const p=el("div",{class:"passage"});
  P.body.forEach(par=>p.appendChild(el("p",{},par)));
  w.appendChild(p);
  const t0=performance.now();
  const clock=el("div",{class:"timer center",style:"margin-bottom:12px"},"0:00");
  w.appendChild(clock);
  const iv=setInterval(()=>{clock.textContent=fmtT((performance.now()-t0)/1000);},500);
  TIMERS.push(iv);
  w.appendChild(el("button",{class:"btn", onClick:()=>{
    clearInterval(iv);
    const sec=(performance.now()-t0)/1000;
    const pw = P.body.join(" ").split(/\s+/).filter(Boolean).length;
    const raw = pw/(sec/60);
    a.wpm = (sec>1.5 && isFinite(raw) && raw>=3 && raw<=350) ? raw : null;
    a.phase="result"; open(assessmentScreen);
  }}, t.done_reading));
  return w;
}
function resultPhase(w){
  const t=T(), a=ASS, st=L();
  const fit = fitSlope(a.rows);
  const acc = a.rows.filter(r=>r.ok).length/a.rows.length;
  const prevSlope = st.slopeHistory.length? st.slopeHistory[st.slopeHistory.length-1] : null;

  if(!a.saved){
    a.saved=true;
    if(fit) st.slopeHistory.push({t:Date.now(), slope:fit.slope, intercept:fit.intercept, n:fit.n, r2:+fit.r2.toFixed(2)});
    if(a.wpm && isFinite(a.wpm)) st.wpmHistory.push({t:Date.now(), wpm:a.wpm, id:"assessment", read:1});
    markDay(); addXP(60); saveState();
  }

  w.appendChild(el("h2",{},t.as_result));
  if(!fit){
    const nc=el("section",{class:"card"});
    nc.appendChild(el("h3",{},t.as_nofit));
    nc.appendChild(el("p",{},t.as_nofit_sub));
    const nb=listenBtn(t.as_nofit+". "+t.as_nofit_sub);
    if(nb) nc.appendChild(el("div",{class:"listenrow",style:"margin:10px 0 0"}, nb));
    w.appendChild(nc);
    announce(t.as_nofit+". "+t.as_nofit_sub);
  }
  if(fit){
    const c=el("section",{class:"card"});
    c.appendChild(el("p",{class:"eyebrow"},t.as_slope_line));
    const m=el("div",{class:"metric"});
    m.appendChild(el("span",{class:"n"},String(fit.slope)));
    m.appendChild(el("span",{class:"u"},t.as_ms));
    c.appendChild(m);
    c.appendChild(el("p",{class:"muted"},t.slope_help));
    if(prevSlope){
      const d=fit.slope-prevSlope.slope;
      c.appendChild(el("div",{class:"note"},
        (isHe()? `${t.as_compare}: ${d<0?"ירידה של ":"עלייה של "}${Math.abs(d)} מילישניות לאות.`
               : `${t.as_compare}: ${d<0?"down ":"up "}${Math.abs(d)} ms per letter.`)
        + " " + t.honest_1));
    } else {
      c.appendChild(el("div",{class:"note"}, t.as_first));
    }
    w.appendChild(c);
  }
  const grid=el("div",{class:"metricgrid",style:"margin-bottom:16px"});
  grid.appendChild(mini(t.reading_speed, (a.wpm!==null&&a.wpm!==undefined)? String(Math.round(a.wpm)):"—", t.wpm));
  grid.appendChild(mini(t.as_acc, Math.round(acc*100)+"%",""));
  w.appendChild(grid);

  // per-length breakdown makes the length effect visible, not just abstract
  const tbl=el("section",{class:"card"});
  tbl.appendChild(el("p",{class:"eyebrow"}, isHe()?"זמן קריאה לפי אורך מילה":"Reading time by word length"));
  const byLen={};
  a.rows.filter(r=>r.ok).forEach(r=>(byLen[r.len]=byLen[r.len]||[]).push(r.rt));
  Object.keys(byLen).sort((x,y)=>x-y).forEach(k=>{
    const arr=byLen[k], avg=Math.round(arr.reduce((s,v)=>s+v,0)/arr.length);
    const row=el("div",{class:"pair"});
    row.appendChild(el("span",{}, isHe()? `${k} אותיות` : `${k} letters`));
    row.appendChild(el("span",{class:"ct"}, (avg/1000).toFixed(2)+"s"));
    tbl.appendChild(row);
  });
  w.appendChild(tbl);
  const spokenResult = fit
    ? `${t.as_result}. ${t.as_slope_line} ${fit.slope} ${t.as_ms}. ${t.slope_help}`
    : t.as_result;
  if(fit){
    const lr3=listenRow(spokenResult); if(lr3) w.appendChild(lr3);
    announce(spokenResult);
  }
  w.appendChild(el("button",{class:"btn", onClick:()=>{ ASS=null; go("progress"); }}, t.done));
  return w;
}

/* ============================================================
   LIBRARY / FREE READING
   ============================================================ */
function libraryScreen(){
  const t=T(), st=L();
  const w=el("div",{class:"screen",style:"padding-top:18px"});
  w.appendChild(el("button",{class:"iconbtn","aria-label":t.back, onClick:close},"✕"));
  w.appendChild(el("h2",{style:"margin-top:14px"},t.free_read));
  w.appendChild(el("p",{class:"muted"},t.free_read_sub));

  const ta=el("textarea",{rows:4, placeholder:t.paste_here, dir: T().dir,
    style:"width:100%;padding:14px;font-size:17px;border:1px solid var(--rule);border-radius:5px;"+
          "background:var(--paper-2);color:var(--ink);font-family:inherit;margin-bottom:12px"});
  w.appendChild(ta);
  w.appendChild(el("button",{class:"btn", onClick:()=>{
    const v=ta.value.trim(); if(!v) return;
    st.library.unshift({t:Date.now(), text:v, title:v.split(/\s+/).slice(0,5).join(" ")});
    st.library=st.library.slice(0,20); saveState(); open(libraryScreen);
  }}, t.show_it));

  w.appendChild(el("div",{class:"rule"}));
  if(!st.library.length){
    w.appendChild(el("p",{class:"muted"},t.empty_lib));
  } else {
    st.library.forEach((it,i)=>{
      const card=el("section",{class:"card"});
      card.appendChild(el("h3",{}, it.title + (it.text.length>40?"…":"")));
      card.appendChild(el("p",{class:"muted"}, new Date(it.t).toLocaleDateString(S.lang==="he"?"he-IL":"en-GB")));
      const row=el("div",{class:"btnrow"});
      row.appendChild(el("button",{class:"btn sm quiet", onClick:()=>open(()=>readerScreen(it))}, t.show_it));
      row.appendChild(el("button",{class:"btn sm ghost", onClick:()=>{
        st.library.splice(i,1); saveState(); open(libraryScreen);
      }}, isHe()?"מחיקה":"Delete"));
      card.appendChild(row);
      w.appendChild(card);
    });
  }
  // built-in passages are always available to read for pleasure
  const bp=el("section",{class:"card"});
  bp.appendChild(el("p",{class:"eyebrow"}, isHe()?"קטעים מוכנים":"Ready passages"));
  [...C().passages, ...(st.genPassages||[]).filter(p=>p.lang===S.lang)].forEach(P=>{
    bp.appendChild(el("div",{class:"pair"},
      el("span",{},P.title),
      el("button",{class:"btn sm quiet", onClick:()=>open(()=>readerScreen({title:P.title,text:P.body.join("\n")}))}, t.show_it)));
  });
  w.appendChild(bp);
  return w;
}
function readerScreen(item){
  const t=T();
  const w=el("div",{class:"screen",style:"padding-top:18px"});
  w.appendChild(el("button",{class:"iconbtn","aria-label":t.back, onClick:()=>open(libraryScreen)},"✕"));
  w.appendChild(el("h3",{style:"margin-top:14px"}, item.title));
  const p=el("div",{class:"passage"});
  item.text.split(/\n+/).forEach(par=>p.appendChild(el("p",{},par)));
  w.appendChild(p);
  w.appendChild(el("button",{class:"btn ghost", onClick:openLook}, t.appearance));
  return w;
}

/* ============================================================
   BOOT
   ============================================================ */
const _render = render;
render = function(){ clearTimers(); _render(); };

function installLifecycle(){
  const bail=()=>{ if(SESS) parkSession(); flushState(); };
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="hidden") bail(); else if(SESS) requestWake();
  });
  window.addEventListener("pagehide", bail);
  window.addEventListener("beforeunload", bail);
}

(async function boot(){
  await loadState();
  installLifecycle();
  initServiceWorker();
  if(!S.voice) S.voice={on:true,auto:true,rate:0.9,force:false};
  if(S.voice.force===undefined) S.voice.force=false;
  ["he","en"].forEach(k=>{ if(!S[k].errorTypes) S[k].errorTypes={}; if(!S[k].errorLog) S[k].errorLog=[];
                           if(!S[k].exerciseStats) S[k].exerciseStats={};
                           if(S[k].committedTrials===undefined) S[k].committedTrials=S[k].totalTrials||0;
                           if(!S[k].genPassages) S[k].genPassages=[]; });
  // browsers refuse to speak before a gesture; arm the engine on the first tap
  document.addEventListener("pointerdown", function prime(){
    if(!TTS.primed && TTS.supported()){ try{ window.speechSynthesis.resume(); }catch(e){} }
    document.removeEventListener("pointerdown", prime);
  }, {once:true});
  TTS.init();
  applyLang(); applyLook();
  render();
})();
</script>
