<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEXIA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Reading practice for pure alexia, in Hebrew and English.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LEXIA">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ============================================================
   LEXIA — design tokens
   Palette: "ink & limestone". Cool paper, slate-blue instrument
   accent, muted signal colours (never alarm-red: this population
   does not need to be startled).
   ============================================================ */
:root{
  --paper:#F4F5F3;
  --paper-2:#FFFFFF;
  --paper-3:#EAECE8;
  --ink:#16181C;
  --ink-2:#4A5058;
  --ink-3:#7B828B;
  --rule:#D6D9D4;
  --accent:#2C5F7C;
  --accent-2:#E3EDF2;
  --good:#2E7D5B;
  --good-2:#E2F0EA;
  --warn:#A9741B;
  --bad:#A8483F;
  --bad-2:#F5E7E5;
  --stage-bg:#FFFFFF;
  --stage-fg:#16181C;
  --radius:5px;
  --tap:56px;
  --sp:8px;
  --ui-font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Arial Hebrew",sans-serif;
  --read-font: system-ui,-apple-system,"Segoe UI",Arial,"Arial Hebrew",sans-serif;
  --read-size:30px;
  --read-track:0em;
  --read-leading:1.7;
}
[data-theme="dark"]{
  --paper:#14171A; --paper-2:#1C2126; --paper-3:#262C32;
  --ink:#EDEFEC; --ink-2:#A7AEB5; --ink-3:#78808A;
  --rule:#333A41;
  --accent:#7FB3CE; --accent-2:#1E2C36;
  --good:#6BBF95; --good-2:#17281F;
  --warn:#D6A44C;
  --bad:#D98B82; --bad-2:#2C1E1D;
  --stage-bg:#1C2126; --stage-fg:#EDEFEC;
}
[data-theme="contrast"]{
  --paper:#000000; --paper-2:#000000; --paper-3:#141414;
  --ink:#FFFFFF; --ink-2:#FFFFFF; --ink-3:#D0D0D0;
  --rule:#FFFFFF;
  --accent:#FFE14D; --accent-2:#241F00;
  --good:#5BFF9E; --good-2:#00230F;
  --warn:#FFC14D;
  --bad:#FF9A8F; --bad-2:#2A0F0C;
  --stage-bg:#000000; --stage-fg:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ui-font);
  font-size:17px; line-height:1.5;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
     background:var(--paper);position:relative}
body{padding-top:env(safe-area-inset-top)}
.topbar{padding-top:calc(14px + env(safe-area-inset-top))}

/* ---------- chrome ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule);
        position:sticky;top:0;background:var(--paper);z-index:20}
.topbar h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.topbar .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:var(--radius);
         min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
         font-size:18px;padding:0 10px}
.iconbtn:active{background:var(--paper-3)}

.screen{flex:1;padding:22px 18px 110px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

.tabbar{position:fixed;bottom:0;inset-inline:0;margin:0 auto;max-width:760px;
        display:grid;grid-template-columns:repeat(4,1fr);
        background:var(--paper);border-top:1px solid var(--rule);z-index:30;
        padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;padding:11px 4px 13px;display:flex;flex-direction:column;
               align-items:center;gap:3px;font-size:12.5px;color:var(--ink-3);min-height:var(--tap)}
.tabbar button .g{font-size:19px;line-height:1}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:650}
.tabbar button[aria-current="page"] .g{transform:translateY(-1px)}

/* ---------- primitives ---------- */
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card.flat{background:transparent}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin:0 0 6px}
h2{font-size:22px;margin:0 0 10px;font-weight:680;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 8px;font-weight:650}
p{margin:0 0 12px;color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:14px}
.rule{height:1px;background:var(--rule);margin:18px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
     min-height:var(--tap);padding:0 22px;border-radius:var(--radius);
     border:1px solid var(--accent);background:var(--accent);color:#fff;
     font-weight:640;font-size:17px;width:100%}
[data-theme="dark"] .btn,[data-theme="contrast"] .btn{color:#0E1114}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.quiet{background:var(--paper-3);color:var(--ink);border-color:transparent}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px}
.btnrow>*{flex:1}

/* ---------- the stage: signature element ----------
   Every stimulus appears inside a plate framed with registration
   marks, the way a letterform would be proofed on press. The stage
   itself is deliberately plain — its typography belongs to the user. */
.stage{position:relative;background:var(--stage-bg);border:1px solid var(--rule);
       border-radius:2px;min-height:230px;display:flex;align-items:center;justify-content:center;
       padding:28px 20px;margin:10px 0 20px;overflow:hidden}
.stage::before,.stage::after,.stage>.reg1,.stage>.reg2{content:"";position:absolute;width:13px;height:13px;
       border-color:var(--accent);opacity:.55;pointer-events:none}
.stage::before{top:7px;inset-inline-start:7px;border-top:2px solid;border-inline-start:2px solid}
.stage::after{top:7px;inset-inline-end:7px;border-top:2px solid;border-inline-end:2px solid}
.stage>.reg1{bottom:7px;inset-inline-start:7px;border-bottom:2px solid;border-inline-start:2px solid}
.stage>.reg2{bottom:7px;inset-inline-end:7px;border-bottom:2px solid;border-inline-end:2px solid}
.stim{font-family:var(--read-font);font-size:clamp(44px,13vw,88px);color:var(--stage-fg);
      letter-spacing:var(--read-track);line-height:1.25;text-align:center;font-weight:500}
.stim.word{font-size:clamp(34px,9.5vw,62px)}
.mask{font-family:var(--read-font);font-size:clamp(44px,13vw,88px);color:var(--stage-fg);opacity:.75;letter-spacing:.02em}
.fixation{font-size:42px;color:var(--ink-3)}

/* ---------- response grid ---------- */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:74px;border:1.5px solid var(--rule);background:var(--paper-2);border-radius:var(--radius);
        font-family:var(--read-font);font-size:26px;font-weight:520;display:flex;align-items:center;
        justify-content:center;padding:8px;word-break:break-word}
.choice.wide{grid-column:span 2;min-height:60px;font-size:20px}
.choice:active{background:var(--paper-3)}
.choice.correct{border-color:var(--good);background:var(--good-2);color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-2);color:var(--bad)}
.choice.reveal{border-color:var(--good);border-style:dashed}

/* ---------- progress / meters ---------- */
.sessbar{display:flex;gap:4px;margin-top:12px}
.sessbar i{flex:1;height:5px;background:var(--paper-3);border-radius:2px}
.sessbar i.done{background:var(--accent)}
.sessbar i.now{background:var(--accent);opacity:.5}

.metric{display:flex;align-items:baseline;gap:8px}
.metric .n{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric .u{font-size:14px;color:var(--ink-3)}
.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;background:var(--paper-2)}
.mini .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:640}
.mini .v{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.mini .d{font-size:13px;color:var(--ink-3)}
.delta.up{color:var(--good)} .delta.down{color:var(--good)} .delta.flat{color:var(--ink-3)}

.spark{width:100%;height:56px;display:block}
.masterygrid{display:flex;flex-wrap:wrap;gap:6px;direction:inherit}
.cell{width:44px;height:48px;border:1px solid var(--rule);border-radius:3px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:var(--paper-2);font-family:var(--read-font)}
.cell b{font-size:21px;font-weight:500;line-height:1}
.cell i{display:block;width:26px;height:4px;border-radius:2px;background:var(--paper-3);margin-top:5px}
.cell i span{display:block;height:100%;border-radius:2px;background:var(--good)}

.pair{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.pair:last-child{border-bottom:0}
.pair .lp{font-family:var(--read-font);font-size:22px}
.pair .ct{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:14px}

/* ---------- stage map ---------- */
.stagerow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
.stagerow:last-child{border-bottom:0}
.stagenum{flex:0 0 38px;height:38px;border-radius:50%;border:1.5px solid var(--rule);display:flex;
          align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.stagerow.on .stagenum{border-color:var(--accent);color:var(--accent);background:var(--accent-2)}
.stagerow.done .stagenum{border-color:var(--good);color:#fff;background:var(--good)}
.stagerow .body{flex:1}
.stagerow .body h3{margin-bottom:2px}
.lock{font-size:13px;color:var(--ink-3)}

/* ---------- passage reader ---------- */
.passage{font-family:var(--read-font);font-size:var(--read-size);letter-spacing:var(--read-track);
         line-height:var(--read-leading);color:var(--stage-fg);background:var(--stage-bg);
         border:1px solid var(--rule);border-radius:2px;padding:24px 20px;margin:12px 0 18px;
         max-width:36em;position:relative}
.passage p{color:inherit;margin:0 0 .8em}
.passage p:last-child{margin-bottom:0}
.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;letter-spacing:.02em}

/* ---------- appearance sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheetbody{background:var(--paper);width:100%;max-width:760px;border-radius:12px 12px 0 0;padding:20px 18px 30px;
           max-height:88vh;overflow:auto;border-top:1px solid var(--rule)}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
             font-weight:650;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--rule);background:var(--paper-2);border-radius:var(--radius);
            min-height:46px;padding:0 14px;font-size:15px;flex:1;min-width:80px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-2);color:var(--accent);font-weight:650}
input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.swatches{display:flex;gap:8px}
.swatch{width:46px;height:46px;border-radius:var(--radius);border:2px solid var(--rule)}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-2)}

/* ---------- language gate ---------- */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px 22px}
.gate .mark{font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:26px}
.gatebtn{width:100%;min-height:96px;border:1.5px solid var(--rule);background:var(--paper-2);
         border-radius:var(--radius);padding:16px 20px;text-align:start;margin-bottom:12px;display:block}
.gatebtn b{display:block;font-size:30px;font-weight:660;margin-bottom:3px}
.gatebtn span{display:block;font-size:14px;color:var(--ink-3)}
.gatebtn.primary{border-color:var(--accent);background:var(--accent-2)}

/* ---------- misc ---------- */
.note{border-inline-start:3px solid var(--accent);background:var(--accent-2);padding:12px 14px;
      border-radius:0 var(--radius) var(--radius) 0;font-size:14.5px;color:var(--ink-2);margin-bottom:16px}
.note.caution{border-color:var(--warn);background:transparent;border:1px solid var(--rule);border-inline-start:3px solid var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--rule);border-radius:99px;padding:6px 13px;font-size:13.5px;color:var(--ink-2);background:var(--paper-2)}
.chip b{font-weight:700;color:var(--ink)}
.center{text-align:center}
.big{font-size:19px}
canvas.trace{touch-action:none;display:block;margin:0 auto;background:var(--stage-bg);border-radius:2px}
.hidden{display:none!important}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grade{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:3px 7px;
       border-radius:3px;border:1px solid var(--rule);color:var(--ink-3)}
.grade.v{color:var(--good);border-color:var(--good)}
.grade.x{color:var(--warn);border-color:var(--warn)}
.listen{border:1px solid var(--rule);background:var(--paper-2);border-radius:99px;
        min-height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;
        font-size:14.5px;color:var(--ink-2);font-weight:600}
.listen .spk{font-size:16px;line-height:1}
.listen.on{border-color:var(--accent);color:var(--accent);background:var(--accent-2)}
.listen.on .spk{animation:pulse 1.1s ease-in-out infinite}
.listen.silent{border-color:var(--warn);color:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.listenrow{display:flex;justify-content:flex-start;margin:0 0 14px}
.voicebadge{font-size:13px;color:var(--ink-3);margin-top:12px}
.diagline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
.diagline:last-child{border-bottom:0}
.diagline b{font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.diagline.bad b{color:var(--warn)} .diagline.good b{color:var(--good)}
</style>
</head>
<body>
<div id="app" role="application"></div>
<script>
/* =============================================================
   LEXIA — bilingual rehabilitation trainer for pure alexia
   Single-file build. Hebrew-first.
   The interface language and the training language are the SAME
   choice: in Hebrew mode nothing English appears, and vice versa.
   ============================================================= */

/* ---------- i18n ---------- */
const STR = {
  he:{
    dir:"rtl", name:"עברית",
    app:"לקסיה",
    tab_today:"היום", tab_program:"תרגול", tab_progress:"התקדמות", tab_settings:"הגדרות",

    stage_of:"שלב", minutes:"דקות", exercises:"תרגילים",

    quick3:"תרגול קצר · 3 דקות", read_something:"קריאה חופשית",

    run_assessment:"מדידת קריאה", run_assessment_sub:"בערך 6 דקות. מודדת כמה מאט אותך כל אות נוספת.",

    // exercises
    ex_letter_flash:"אות בהבזק", ex_letter_discrim:"איתור אות", ex_trace:"מעקב באצבע",
    ex_word_flash:"מילה בהבזק", ex_word_pick:"בחירת מילה", ex_root:"משפחת שורש",
    ex_final:"אותיות סופיות", ex_sentence:"משפט והבנה", ex_mor:"קריאה חוזרת",

    find_letter:"מצאו את האות", not_sure:"לא בטוח",

    root_q:"איזו מילה לא שייכת למשפחה הזאת?",
    final_q:"מהי הצורה הסופית של האות הזאת?",
    case_q:"איזו אות מתאימה?",
    read_aloud:"קראו בקול, ואז לחצו",
    ive_read:"קראתי", done_reading:"סיימתי לקרוא",
    start_reading:"מתחילים לקרוא", read_n:"קריאה", of:"מתוך",
    comp_q:"שאלת הבנה",
    pause:"השהיה", resume:"המשך", quit:"יציאה",
    // feedback
    correct:"נכון", wrong:"לא נכון", it_was:"האות הייתה", it_was_w:"המילה הייתה",
    break_title:"הפסקה קצרה",
    break_body:"הקצב שלכם יורד. זה סימן לעייפות, לא לכישלון. אפשר לנוח דקה או לסיים להיום.",
    break_rest:"נוח דקה", break_end:"סיום להיום", break_go:"ממשיכים בכל זאת",
    // summary
    sess_done:"האימון הושלם", accuracy:"דיוק", time:"זמן", points:"נקודות",
    what_moved:"מה השתנה", nothing_yet:"עוד מעט נתונים ונוכל להראות מגמה.",
    tomorrow:"מחר נשקיע יותר זמן ב", done:"סיום",
    // progress
    reading_speed:"מהירות קריאה", wpm:"מילים בדקה",
    slope:"האטה לכל אות", slope_u:"מילישניות לאות",
    slope_help:"זה המספר שמתאר את ההפרעה עצמה: כמה זמן נוסף לוקחת כל אות נוספת במילה. נמוך יותר = טוב יותר.",
    comprehension:"הבנה", letters_mastered:"אותיות שנשלטו",
    letter_mastery:"שליטה באותיות", confusions:"בלבולים נפוצים",
    no_data:"אין עדיין נתונים. התחילו במדידת קריאה.",
    history:"היסטוריית אימונים", sessions:"אימונים", total_trials:"סך תרגולים",
    honest_1:"שיפור במהירות קריאה נמדד בחודשים, לא בימים.",
    // settings
    appearance:"תצוגת קריאה", font:"גופן", size:"גודל", tracking:"רווח בין אותיות",
    leading:"רווח בין שורות", theme:"ערכת צבעים",

const KEY = "lexia_state_v1";

let mem = null;

const STORE = {
  mode: "memory",
  _ls(){ try{ const k="__lexia_t"; window.localStorage.setItem(k,"1");
               window.localStorage.removeItem(k); return window.localStorage; }catch(e){ return null; } },
  detect(){
    this.mode = this._ls() ? "local" : (typeof window!=="undefined" && window.storage ? "artifact" : "memory");
    return this.mode;
  },
  async get(key){
    const ls=this._ls();
    if(ls){ const v=ls.getItem(key); if(v!==null) return v; }
    if(typeof window!=="undefined" && window.storage){
      try{ const r=await window.storage.get(key); if(r && r.value) return r.value; }catch(e){}
    }
    return mem && mem[key] || null;
  },
  async set(key, value){
    let stored=false;
    const ls=this._ls();
    if(ls){ try{ ls.setItem(key, value); stored=true; }
            catch(e){ this.quotaHit=true; } }
    if(typeof window!=="undefined" && window.storage){
      try{ await window.storage.set(key, value); stored=true; }catch(e){}
    }
    if(!stored){ mem = mem||{}; mem[key]=value; }
    return stored;
  }
};

function stair(kind, ok){

  if(ok){
    st.run[kind]++;
    if(st.run[kind]>=3){ st.run[kind]=0; st.exposure[kind]=clamp(Math.round(st.exposure[kind]*0.86), lo, hi); }

  const s=L().letterStats[ch]; if(!s||s.n<3) return 0;
  const acc=s.k/s.n; const speed = s.best? clamp(1 - (s.best-350)/2000, 0, 1) : 0;

function wordDistractors(target, count){
  const len = target.length;

  } else {
    const cap = x => x.charAt(0).toUpperCase()+x.slice(1);
    if(shape<0.34)      text = `${cap(time)}, ${midForm(subj.d)} ${vf} ${objText} ${place}.`;
    else if(shape<0.67) text = `${subj.d} ${vf} ${objText} ${place} ${time}.`;
    else              { text = `${subj.d} ${vf} ${objText} ${place}.`; hasTime=false; }
    text = cap(text);
  }
  return {text, subj, verb, vf, cat, obj, objText, place, time, hasTime, lang: lang||S.lang};
}

/* Questions are generated from the frame, so the key is exact and the
   distractors are drawn from the same semantic slot. */
function genQuestion(sent, opts){
  opts = opts||{};
  const lang = sent.lang, he = lang==="he";
  const G = CONTENT[lang].gen;
  const low = x => he ? x : midForm(x);
  let kinds = opts.noWho ? ["what","where"] : ["what","who","where"];
  if(sent.hasTime !== false) kinds.push("when");   // never ask about an absent slot
  const pick = rnd(kinds);
  // always return n distinct distractors: widen the pool if the narrow one is thin
  const others = (pool, not, n, wider) => {
    let out = shuffle(pool.filter(x=>x!==not)).slice(0,n);
    if(out.length<n && wider){
      const extra = shuffle(wider.filter(x=>x!==not && out.indexOf(x)<0));
      out = out.concat(extra.slice(0, n-out.length));
    }
    return out;
  };

  if(pick==="what"){
    return { q: he ? `${G.q.what} ${sent.subj.d} ${sent.vf}?`
                   : `What did ${low(sent.subj.d)} ${sent.verb.b}?`,
             answer: sent.obj,
             wrong: others(G.objects[sent.cat], sent.obj, 3,
                           Object.values(G.objects).flat()) };
  }
  if(pick==="who"){
    // keep distractor subjects in the same agreement class so the verb
    // form in the question cannot give the answer away
    const pool = he ? G.subjects.filter(x=>x.g===sent.subj.g) : G.subjects;
    const ot = sent.objText || sent.obj;
    return { q: he ? `${G.q.who} ${sent.vf} ${ot}?`
                   : `Who ${sent.verb.v} ${ot}?`,
             answer: sent.subj.d,
             wrong: others(pool.map(x=>x.d), sent.subj.d, 3, G.subjects.map(x=>x.d)) };
  }
  if(pick==="where"){
    const ot2 = sent.objText || sent.obj;
    return { q: he ? `${G.q.where} ${sent.subj.d} ${sent.vf} ${ot2}?`
                   : `Where did ${low(sent.subj.d)} ${sent.verb.b} ${ot2}?`,
             answer: sent.place,
             wrong: others(G.places, sent.place, 3, G.places) };
  }
  const ot3 = sent.objText || sent.obj;
  return { q: he ? `${G.q.when} ${sent.subj.d} ${sent.vf} ${ot3}?`
                 : `When did ${low(sent.subj.d)} ${sent.verb.b} ${ot3}?`,
           answer: sent.time,
           wrong: others(G.times, sent.time, 3, G.times) };
}

/* Three sentences about one subject, pronouns after the first mention. */
function genPassage(lang){
  lang = lang || S.lang;
  const he = lang==="he";
  const G = CONTENT[lang].gen;
  const subj = rnd(G.subjects);
  const openTime = rnd(G.times);
  const joinPool = G.joins;   // forward order, not shuffled
  const used=[]; const sents=[];
  for(let i=0;i<4;i++){
    let v; let guard=0;
    do{ v = rnd(G.verbs); guard++; } while(used.includes(v.c) && guard<12);
    used.push(v.c);
    const obj=rnd(G.objects[v.c]), place=rnd(G.places), time=rnd(G.times);
    const vf = he ? v[subj.g] : v.v;
    const ot = (he && (G.defCats||[]).indexOf(v.c)>=0) ? "את "+obj : obj;
    const who = i===0 ? subj.d : subj.p;
    const join = joinPool[(i-1) % joinPool.length];
    let line;
    if(he) line = i===0 ? `${openTime} ${who} ${vf} ${ot} ${place}.`
                        : `${join} ${who} ${vf} ${ot} ${place}.`;
    else   line = i===0 ? `${openTime.charAt(0).toUpperCase()+openTime.slice(1)}, ${midForm(who)} ${vf} ${ot} ${place}.`
                        : `${join} ${who} ${vf} ${ot} ${place}.`;
    if(!he) line = line.charAt(0).toUpperCase()+line.slice(1);
    sents.push({line, pronoun:i>0,
      frame:{text:line, subj:{d:who, g:subj.g, p:subj.p}, verb:v, vf, cat:v.c,
             obj, objText:ot, place, time:openTime, hasTime:(i===0), lang}});
  }
  const title = he ? `${subj.d} — יום אחד` : `${subj.d} — one day`;
  return {
    id: "gen-"+Math.random().toString(36).slice(2,9),
    title,
    body: [sents.slice(0,2).map(x=>x.line).join(" "), sents.slice(2).map(x=>x.line).join(" ")],
    q: sents.slice(0,3).map(x=>{ const g=genQuestion(x.frame, {noWho:x.pronoun});
        const choices=shuffle([g.answer, ...g.wrong]);
        return {q:g.q, a:choices, c:choices.indexOf(g.answer)}; }),
    generated:true
  };
}

function displayWord(w){
  if(isHe() && S.look.nikud && HE.nikud[w]) return HE.nikud[w];
  return w;
}
/* Every reading-rate record goes through here. Bounds are clinical, not
   arbitrary: nobody reads a passage aloud in under 1.5s, and oral reading
   above ~350 wpm is a mis-tap rather than a measurement. Returns null so the
   caller can tell the person what happened instead of dropping it silently. */
function recordWpm(words, sec, id, read){
  if(!(sec>1.5) || !(words>0)) return null;
  const wpm = words/(sec/60);
  if(!isFinite(wpm) || wpm<3 || wpm>350) return null;
  L().wpmHistory.push({t:Date.now(), wpm, id, read});
  return wpm;
}
/* ============================================================
   ERROR CLASSIFICATION
   Counting errors tells you someone is struggling. Classifying them
   tells you what to do about it. Reading ד as ר is a visual
   discrimination failure; reading מכונית as מכוניות is a morphological
   ending failure; getting the first three letters right and inventing
   the rest is serial decoding running out of capacity. Three different
   problems, three different drills.
   ============================================================ */
const NIKUD = /[\u0591-\u05C7]/g;
const bare = w => String(w==null?"":w).replace(NIKUD,"").trim();
const FINAL_OF = {"כ":"ך","מ":"ם","נ":"ן","פ":"ף","צ":"ץ"};
const BASE_OF  = {"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
const baseLetter = ch => BASE_OF[ch] || ch;

function sharedPrefix(a,b){ let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++; return i; }
function sharedSuffix(a,b){ let i=0; while(i<a.length && i<b.length && a[a.length-1-i]===b[b.length-1-i]) i++; return i; }
function sameMultiset(a,b){
  return a.length===b.length && [...a].sort().join("")===[...b].sort().join("");
}
function substitutions(a,b){
  if(a.length!==b.length) return null;
  const out=[]; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) out.push([a[i],b[i],i]);
  return out;
}
/* longest common subsequence length — a rough consonantal skeleton test */
function lcsLen(a,b){
  const m=a.length,n=b.length; let prev=new Array(n+1).fill(0),cur=new Array(n+1).fill(0);
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++) cur[j] = a[i-1]===b[j-1] ? prev[j-1]+1 : Math.max(prev[j],cur[j-1]);
    [prev,cur]=[cur,prev]; cur.fill(0);
  }
  return prev[n];
}
const EN_SUFFIX = ["s","es","ed","ing","er","est","ly","ness","ment"];
function morphRelated(a,b,lang){
  if(lang==="he"){
    // same root family in the curated list?
    for(const f of HE.roots){
      const all=[...f.in];
      if(all.includes(a) && all.includes(b)) return true;
    }
    // or a shared 3+ letter skeleton in order, with different affixes
    const sk = lcsLen(a,b);
    return sk>=3 && sk >= Math.min(a.length,b.length)-2 && a.length!==b.length;
  }
  const [sh,lo] = a.length<=b.length ? [a,b] : [b,a];
  if(lo.startsWith(sh) && EN_SUFFIX.includes(lo.slice(sh.length))) return true;
  const stem = sharedPrefix(a,b);
  return stem>=4 && stem>=Math.min(a.length,b.length)-3;
}

/* Returns {type, pair?} or null when the response was correct. */
function classifyError(target, response, lang){
  lang = lang || S.lang;
  if(response===null || response===undefined || response==="") return {type:"unsure"};
  const a = bare(target), b = bare(response);
  if(!a || !b || a===b) return null;

  const A=[...a], B=[...b];
  if(A.length===1 && B.length===1){
    if(baseLetter(a)===baseLetter(b)) return {type:"final_form", pair:[a,b]};
    if(lang==="en" && a.toLowerCase()===b.toLowerCase()) return {type:"letter_case", pair:[a,b]};
    const conf = (CONTENT[lang].confuse[a]||[]);
    if(conf.includes(b)) return {type:"similar_letter", pair:[a,b]};
    return {type:"unrelated", pair:[a,b]};
  }

  const subs = substitutions(a,b);
  if(subs && subs.length===1){
    const [x,y] = subs[0];
    if(baseLetter(x)===baseLetter(y)) return {type:"final_form", pair:[x,y]};
    return {type:"similar_letter", pair:[x,y]};
  }
  if(sameMultiset(a,b)) return {type:"letter_order"};

  // one word is the other with material added or removed at one end
  const headExtra = a.endsWith(b) ? a.slice(0,a.length-b.length)
                  : b.endsWith(a) ? b.slice(0,b.length-a.length) : null;
  const tailExtra = a.startsWith(b) ? a.slice(b.length)
                  : b.startsWith(a) ? b.slice(a.length) : null;
  const AFFIX = lang==="he" ? ["ים","ות","יים","ה","ת","י","ן","נו","כם","הם","יה","יו"]
                            : EN_SUFFIX;
  if(headExtra && [...headExtra].length<=2) return {type:"word_onset", kept:b.length};
  if(tailExtra && AFFIX.indexOf(tailExtra)>=0) return {type:"morphology"};
  if(tailExtra) return {type:"truncation", kept:Math.min(a.length,b.length)};
  if(morphRelated(a,b,lang)) return {type:"morphology"};

  const pre=sharedPrefix(a,b), suf=sharedSuffix(a,b);
  const minLen=Math.min(A.length,B.length);
  const half=Math.max(2,Math.ceil(minLen*0.5));
  // strings are stored in logical order, so index 0 is the first letter READ
  // in Hebrew and English alike
  if(pre>=half && pre>suf) return {type:"truncation", kept:pre};
  if(suf>=half && suf>pre) return {type:"word_onset", kept:suf};
  if(Math.abs(A.length-B.length)>=2) return {type:"length"};
  return {type:"unrelated"};
}

function noteError(target, response, lang){
  const cls = classifyError(target, response, lang);
  if(!cls) return null;
  const st=L();
  st.errorTypes[cls.type] = (st.errorTypes[cls.type]||0)+1;
  st.errorLog.push({t:Date.now(), type:cls.type, target:bare(target), resp:bare(response)});
  if(st.errorLog.length>400) st.errorLog.splice(0, st.errorLog.length-400);
  // a substitution inside a word is still letter-level evidence
  if(cls.pair) noteConfusion(cls.pair[0], cls.pair[1]);
  return cls;
}
function errorProfile(windowN){
  const st=L();
  const log = windowN ? st.errorLog.slice(-windowN) : st.errorLog;
  const counts={}; log.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);
  const total=log.length;
  return Object.entries(counts).sort((x,y)=>y[1]-x[1])
    .map(([type,n])=>({type, n, pct: total? n/total : 0}));
}
function dominantError(minN){
  const p=errorProfile(80);
  if(!p.length) return null;
  const top=p[0];
  const informative = top.type!=="unsure";
  return (top.n>=(minN||5) && top.pct>=0.25 && informative) ? top : null;
}

// Least-squares fit of reaction time on word length -> ms per letter.
function fitSlope(rows){
  const pts = rows.filter(r=>r.ok);
  if(pts.length<6) return null;
  const n=pts.length;
  const mx=pts.reduce((s,p)=>s+p.len,0)/n, my=pts.reduce((s,p)=>s+p.rt,0)/n;
  let num=0, den=0; for(const p of pts){ num+=(p.len-mx)*(p.rt-my); den+=(p.len-mx)**2; }
  if(den===0) return null;
  const b=num/den, a=my-b*mx;
  let ss=0, st=0; for(const p of pts){ const f=a+b*p.len; ss+=(p.rt-f)**2; st+=(p.rt-my)**2; }
  return {slope:Math.round(b), intercept:Math.round(a), n, r2: st? 1-ss/st : 0};
}
/* XP rewards showing up, not being right. Capped so that grinding
   past the prescribed dose earns nothing extra. */
function addXP(n){
  const st=L(); const d=today();
  if(st.xpDay!==d){ st.xpDay=d; st.dayXP=0; }
  st.dayXP=(st.dayXP||0)+n;
  const allowed = Math.max(0, 260 - (st.dayXP - n));
  st.xp += Math.min(n, allowed);
  st.level = 1+Math.floor(st.xp/400);
}
function markDay(){
  const st=L(); const d=today();
  if(st.lastDay===d) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  st.streak = (st.lastDay===y)? st.streak+1 : 1;
  st.longest=Math.max(st.longest, st.streak);
  st.lastDay=d;
  st.weekDays=uniq([...(st.weekDays||[]), d]).slice(-7);
}

const APP_VERSION = "1.0.0";
const BUILD = "2026-08-02";

/* Registration is skipped on file:// where it is unsupported, and any failure
   is swallowed: an app that refuses to start because caching failed would be
   worse than one that simply needs a connection. */
let UPDATE_READY = false;
function initServiceWorker(){
  try{
    if(!("serviceWorker" in navigator)) return;
    if(location.protocol !== "https:" && location.hostname !== "localhost") return;
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            UPDATE_READY = true;   // surfaced in Settings, never mid-exercise
          }
        });
      });
    }).catch(()=>{});
  }catch(e){}
}

/* ============================================================
   SPEECH
   Reads instructions, prompts, feedback and summaries.
   It must never read a stimulus the person is being tested on:
   hearing the answer would turn every recognition exercise into
   a listening exercise. Every call site below is an instruction,
   never a target.
   ============================================================ */
const TTS = {
  _voices:[], primed:false, tried:false, blocked:false,
  lastError:null, lastStart:null, onstatus:null,

  supported(){
    try{
      return typeof window!=="undefined" && "speechSynthesis" in window
        && window.speechSynthesis && typeof window.speechSynthesis.speak==="function"
        && typeof window.SpeechSynthesisUtterance==="function";
    }catch(e){ return false; }
  },
  framed(){ try{ return window.self !== window.top; }catch(e){ return true; } },
  platform(ua){
    ua = ua || ((navigator.userAgent||"") + " " + (navigator.platform||""));
    if(/iPhone|iPad|iPod/i.test(ua)) return "ios";
    if(/Android/i.test(ua)) return "android";
    if(/Mac OS X|Macintosh/i.test(ua)) return "mac";
    if(/Windows/i.test(ua)) return "win";
    return "other";
  },

  /* Read the list live every time. Engines populate it asynchronously and
     some never fire voiceschanged at all, so a cached snapshot taken at boot
     is routinely empty and stays empty. */
  list(){
    if(!this.supported()) return [];
    try{
      const v = window.speechSynthesis.getVoices();
      if(v && v.length) this._voices = v;
    }catch(e){}
    return this._voices || [];
  },
  init(){
    if(!this.supported()) return;
    const load=()=>{ this.list(); this.ping(); };
    load();
    try{ window.speechSynthesis.onvoiceschanged = load; }catch(e){}
    [120,400,1000,2500,5000].forEach(ms=>setTimeout(load, ms));
  },
  ping(){ if(typeof this.onstatus==="function") { try{ this.onstatus(); }catch(e){} } },

  tag(lang){ return lang==="he" ? "he-IL" : "en-GB"; },
  voiceFor(lang){
    const vs = this.list();
    const norm = v => String(v.lang||"").toLowerCase().replace(/_/g,"-");
    // "iw" is the legacy ISO code for Hebrew; Android and several Chrome
    // builds still report it, so both must be accepted.
    const want = lang==="he" ? ["he","iw"] : ["en"];
    for(const wcode of want){
      const hit = vs.find(v=>norm(v).startsWith(wcode+"-")) || vs.find(v=>norm(v)===wcode);
      if(hit) return hit;
    }
    // last resort: some engines mislabel lang but name the language honestly
    if(lang==="he"){
      const byName = vs.find(v=>/hebrew|עברית|carmit|asaf/i.test(String(v.name||"")));
      if(byName) return byName;
    }
    return null;
  },
  /* An English voice reading Hebrew produces gibberish, not an accent, so we
     refuse rather than emit it. Latin script survives any voice, so English
     needs no such guard. The user can override in case detection is wrong. */
  canSpeak(lang){
    if(lang!=="he") return true;
    if(S.voice && S.voice.force) return true;
    if(this.list().length===0) return true;  // no list at all: let the watchdog judge
    return !!this.voiceFor("he");
  },
  hasVoice(lang){ return !!this.voiceFor(lang); },
  speaking(){ try{ return !!(window.speechSynthesis.speaking || window.speechSynthesis.pending); }catch(e){ return false; } },
  stop(){
    try{ window.speechSynthesis.cancel(); }catch(e){}
    this.pendingTimer && clearTimeout(this.pendingTimer);
  },

  speak(text, opts){
    opts = opts||{};
    text = String(text||"").trim();
    if(!this.supported() || !text){ opts.onend && opts.onend(); return false; }
    const lang = opts.lang || S.lang || "he";
    if(!this.canSpeak(lang)){
      this.noVoice = lang; this.ping();
      opts.onend && opts.onend(); return false;
    }
    this.noVoice = null;
    const ss = window.speechSynthesis;
    this.tried = true; this.lastError = null; this.lastStart = null;

    let busy=false;
    try{ busy = !!(ss.speaking || ss.pending); }catch(e){}
    try{ if(busy) ss.cancel(); }catch(e){}
    // Chrome can leave the queue in a paused state after a cancel; an
    // unconditional resume is harmless and unsticks it.
    try{ ss.resume(); }catch(e){}

    const fire = ()=>{
      let u;
      try{ u = new window.SpeechSynthesisUtterance(text); }
      catch(e){ this.lastError="utterance-failed"; this.ping(); opts.onend&&opts.onend(); return; }
      const v = this.voiceFor(lang);
      // use the voice's own tag: an engine that calls Hebrew "iw-IL" may not
      // recognise "he-IL" and will silently fall back to its default voice
      if(v){ u.voice = v; u.lang = v.lang || this.tag(lang); }
      else  { u.lang = this.tag(lang); }
      u.rate  = clamp((S.voice && S.voice.rate) || 0.9, 0.5, 1.5);
      u.pitch = 1; u.volume = 1;

      let started=false, finished=false;
      u.onstart = ()=>{ started=true; this.primed=true; this.blocked=false;
                        this.lastStart=Date.now(); this.ping(); };
      u.onend   = ()=>{ if(finished) return; finished=true; this.ping(); opts.onend&&opts.onend(); };
      u.onerror = (e)=>{ if(finished) return; finished=true;
                         this.lastError=(e && (e.error||e.name)) || "error";
                         this.ping(); opts.onend&&opts.onend(); };
      try{ ss.speak(u); }
      catch(e){ this.lastError="speak-threw"; this.ping(); opts.onend&&opts.onend(); return; }

      // If nothing has begun after a second the engine has swallowed it —
      // typical of a sandboxed frame or a missing voice for the tag.
      this.watchdog && clearTimeout(this.watchdog);
      this.watchdog = setTimeout(()=>{
        if(!started && !finished){
          this.blocked = true;
          if(!this.lastError) this.lastError = "no-audio";
          this.ping(); opts.onend && opts.onend();
        }
      }, 1100);
    };

    // Firing speak() in the same tick as cancel() is a long-standing Chrome
    // bug: the utterance is dropped silently. Give the queue a tick to clear.
    this.pendingTimer && clearTimeout(this.pendingTimer);
    if(busy) this.pendingTimer = setTimeout(fire, 90); else fire();
    return true;
  },

  /* Everything the settings screen needs to explain a failure. */
  diagnose(){
    const vs = this.list();
    return {
      supported: this.supported(),
      framed: this.framed(),
      voiceCount: vs.length,
      he: this.voiceFor("he"), en: this.voiceFor("en"),
      tried: this.tried, blocked: this.blocked, noVoice: this.noVoice,
      error: this.lastError, everSpoke: !!this.lastStart,
      all: vs.map(v=>({name:v.name, lang:v.lang}))
    };
  }
};

/* A listen control. Tap to hear, tap again to stop. */
function listenBtn(text, opts){
  opts = opts||{};
  const t = STR[opts.lang] || T();
  if(!TTS.supported() || !(S.voice && S.voice.on)) return null;
  const b = el("button",{class:"listen","aria-label":t.listen, onClick:()=>{
    if(b.classList.contains("on")){ TTS.stop(); b.classList.remove("on"); return; }
    b.classList.add("on");
    TTS.speak(text,{lang:opts.lang, onend:()=>{
      b.classList.remove("on");
      if(TTS.blocked){
        b.classList.add("silent");
        b.textContent=""; b.appendChild(el("span",{class:"spk"},"🔇"));
        b.appendChild(document.createTextNode(t.voice_silent));
      }
    }});
  }}, el("span",{class:"spk"},"🔊"), opts.compact?null:t.listen);
  return b;
}
function listenRow(text, opts){
  const b = listenBtn(text, opts);
  return b ? el("div",{class:"listenrow"}, b) : null;
}
/* Auto-read, only when the person has asked for it. */
function announceOnce(key, text, opts){
  if(!SESS) return announce(text, opts);
  SESS.said = SESS.said || {};
  if(SESS.said[key]) return;
  SESS.said[key]=true;
  announce(text, opts);
}
function announce(text, opts){
  if(!(S.voice && S.voice.on && S.voice.auto)) return;
  if(!text) return;
  TTS.speak(text, opts);
}
function letterName(ch){
  if(!isHe()) return ch;
  const i = HE.letters.indexOf(ch);
  return i>=0 ? STR.he.lb_letters[i] : ch;
}

/* ============================================================
   EXPORT
   Trial-level CSV is the whole point of running a session: without it
   a slope figure cannot be re-checked by anyone afterwards.
   ============================================================ */
const CSV_COLS = ["ts","iso","session","lang","seq","minute","kind","item","len","resp",
                  "ok","rt","exposure","err","nikud","font","size","track","theme","stage"];
function csvCell(v){
  const t = v===null||v===undefined ? "" : String(v);
  return /[",\n;]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function trialsCSV(){
  const head = CSV_COLS.join(",");
  const rows = TRIALS.map(r=>{
    const o = Object.assign({}, r, {iso:new Date(r.ts).toISOString()});
    return CSV_COLS.map(c=>csvCell(o[c])).join(",");
  });
  // BOM so Excel opens Hebrew correctly instead of mojibake
  return "\ufeff" + [head, ...rows].join("\n");
}
function summaryCSV(){
  const rows=[["measure","lang","date","value","detail"]];
  rows.push(["app_version","", new Date().toISOString(), APP_VERSION, "build "+BUILD]);
  ["he","en"].forEach(lang=>{
    const st=S[lang];
    st.slopeHistory.forEach(x=>rows.push(["slope_ms_per_letter",lang,
      new Date(x.t).toISOString(), x.slope, "n="+x.n+" r2="+x.r2]));
    st.wpmHistory.forEach(x=>rows.push(["wpm",lang,new Date(x.t).toISOString(),
      Math.round(x.wpm), x.id+" read"+x.read]));
    st.compHistory.forEach(x=>rows.push(["comprehension",lang,new Date(x.t).toISOString(), x.pct, ""]));
    st.sessions.forEach(x=>rows.push(["session",lang,new Date(x.t).toISOString(),
      x.sec+"s", x.n+" items, "+x.k+" correct, ended:"+x.ended]));
    Object.entries(st.errorTypes||{}).forEach(([k,v])=>rows.push(["error_type",lang,"",v,k]));
    Object.entries(st.exerciseStats||{}).forEach(([k,v])=>
      rows.push(["exercise",lang,"",v.n,k+" "+Math.round(100*v.k/Math.max(1,v.n))+"%"]));
    for(const a in st.confusion) for(const b in st.confusion[a])
      rows.push(["confusion",lang,"",st.confusion[a][b],a+"->"+b]);
  });
  return "\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\n");
}
function backupJSON(){
  return JSON.stringify({v:1, app:APP_VERSION, build:BUILD,
    exported:new Date().toISOString(), state:S, trials:TRIALS}, null, 1);
}
function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,"-"); }

/* Download, with a clipboard fallback: sandboxed frames block downloads, and
   losing a session's data to a blocked click would be the worst outcome. */
async function saveFile(text, filename, mime){
  try{
    const blob = new Blob([text], {type:(mime||"text/csv")+";charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
    return "download";
  }catch(e){
    try{ await navigator.clipboard.writeText(text); return "clipboard"; }
    catch(e2){ return "failed"; }
  }
}

   ============================================================ */
let route = "today";
let overlay = null;   // when set, takes over the whole screen (session, assessment, reader)

function render(){
  applyLang(); applyLook();
  const app = $("#app"); app.innerHTML="";
  if(!S.lang){ app.appendChild(gateScreen()); return; }
  if(overlay){ app.appendChild(overlay()); return; }
  app.appendChild(topbar());
  const scr = el("main",{class:"screen"});
  ({today:screenToday, program:screenProgram, progress:screenProgress, settings:screenSettings}[route])(scr);
  app.appendChild(scr);
  app.appendChild(tabbar());
  window.scrollTo(0,0);
}
function go(r){ route=r; overlay=null; render(); }
function open(fn){ overlay=fn; render(); }
function close(){ overlay=null; render(); }

function topbar(){
  const t=T();
  return el("header",{class:"topbar"},
    el("h1",{},t.app),
    el("div",{class:"spacer"}),
    el("button",{class:"iconbtn","aria-label":t.appearance, onClick:openLook},"Aa")
  );
}
function tabbar(){
  const t=T();
  const mk=(id,g,label)=>el("button",{ "aria-current": route===id?"page":null, onClick:()=>go(id)},
    el("span",{class:"g"},g), el("span",{},label));
  return el("nav",{class:"tabbar"},
    mk("today","●",t.tab_today), mk("program","▤",t.tab_program),
    mk("progress","▚",t.tab_progress), mk("settings","⚙",t.tab_settings));
}

function stageName(n){ return T()["s"+n]; }

/* The coach speaks only from measured numbers, and never promises. */
function coachLine(){
  const st=L(), t=T();
  const cm=st.confusion; let worst=null,wn=0;
  for(const a in cm) for(const b in cm[a]) if(cm[a][b]>wn){wn=cm[a][b];worst=[a,b];}
  const dom=dominantError(8);
  if(dom && Math.random()<0.6){
    return (t["e_"+dom.type]||dom.type) + ". " + (t["a_"+dom.type]||"");
  }
  const sh=st.slopeHistory;
  if(sh.length>=2){
    const a=sh[sh.length-2].slope, b=sh[sh.length-1].slope;
    if(b < a*0.93) return isHe()
      ? `ההאטה לכל אות ירדה מ־${a} ל־${b} מילישניות. זו התקדמות אמיתית, וקטנה. ${t.honest_1}`
      : `Your per-letter cost fell from ${a} to ${b} ms. That's real progress, and it is small. ${t.honest_1}`;
    if(b > a*1.05) return isHe()
      ? `המדידה האחרונה איטית יותר מהקודמת. יום עייף משנה מדידה. זה לא אומר שנסוגותם.`
      : `Your last measurement was slower than the one before. A tired day moves this number. It does not mean you have gone backwards.`;
    return isHe()
      ? `הקצב יציב בשלוש השבועות האחרונים. רמה יציבה היא לא כישלון, אבל שווה לשנות תרגילים.`
      : `Your pace has been flat for about three weeks. A plateau is not a failure, but it is worth changing the exercises.`;
  }
  if(worst && wn>=3) return isHe()
    ? `${worst[0]} מתבלבלת לכם עם ${worst[1]} — ${wn} פעמים. נעבוד על ההבדל ביניהן.`
    : `You are reading ${worst[0]} as ${worst[1]} — ${wn} times so far. We'll work on telling them apart.`;
  if(st.totalTrials===0) return isHe()
    ? `נתחיל באותיות. תרגול קצר כל יום עדיף על אימון ארוך פעם בשבוע.`
    : `We'll start with letters. A short session every day beats one long session a week.`;
  return null;
}

/* ============================================================
   SCREEN — PROGRAM (stage map)
   ============================================================ */
let PICK = new Set();
let PICK_SCALE = 1;

function screenProgram(root){
  const t=T(), st=L();
  root.appendChild(el("h2",{},t.tab_program));
  root.appendChild(el("div",{class:"note"}, t.all_open));

  /* the recommendation stays a recommendation */
  const rec=el("section",{class:"card"});
  rec.appendChild(el("p",{class:"eyebrow"},t.recommended));
  rec.appendChild(el("h3",{}, `${t.stage_of} ${st.stage} · ${stageName(st.stage)}`));
  rec.appendChild(el("p",{class:"muted"}, t["s"+st.stage+"d"]));
  rec.appendChild(el("button",{class:"btn", onClick:()=>startSession(planSession())}, t.start_session));
  root.appendChild(rec);

  root.appendChild(el("p",{class:"eyebrow",style:"margin-top:24px"}, t.pick_exercise));

  for(let i=1;i<=5;i++){
    const list = catalogue().filter(e=>e.stage===i);
    if(!list.length) continue;
    const box=el("section",{class:"card"});

    const head=el("div",{style:"display:flex;align-items:center;gap:12px;margin-bottom:6px"});
    const num=el("div",{class:"stagenum"+(i===st.stage?"":"")}, String(i));
    if(i===st.stage) num.style.cssText="flex:0 0 38px;height:38px;border-radius:50%;display:flex;"+
      "align-items:center;justify-content:center;font-weight:700;border:1.5px solid var(--accent);"+
      "color:var(--accent);background:var(--accent-2)";
    head.appendChild(num);
    const ttl=el("div",{style:"flex:1"});
    ttl.appendChild(el("h3",{style:"margin:0"}, t["s"+i]));
    ttl.appendChild(el("p",{class:"muted",style:"margin:2px 0 0;font-size:14px"}, t["s"+i+"d"]));
    head.appendChild(ttl);
    box.appendChild(head);
    box.appendChild(el("button",{class:"btn sm quiet",style:"width:100%;margin:8px 0 14px",
      onClick:()=>startSession(planSession(12,i))}, t.whole_stage));

    list.forEach(e=>{
      const stat = st.exerciseStats[e.code];
      const row=el("div",{style:"display:flex;align-items:center;gap:10px;padding:10px 0;"+
        "border-top:1px solid var(--rule)"});

      const info=el("div",{style:"flex:1;min-width:0"});
      const nm=el("div",{style:"display:flex;align-items:center;gap:8px;flex-wrap:wrap"});
      nm.appendChild(el("span",{style:"font-weight:600"}, exName(e.code)));
      nm.appendChild(el("span",{class:"grade "+e.grade}, e.grade==="v"? t.grade_v : t.grade_x));
      info.appendChild(nm);
      info.appendChild(el("div",{class:"muted",style:"font-size:13px;margin-top:2px"},
        stat && stat.n
          ? `${stat.n} ${t.ex_done} · ${Math.round(100*stat.k/Math.max(1,stat.n))}% ${t.ex_acc}`
          : t.ex_new));
      row.appendChild(info);

      const on = PICK.has(e.code);
      const add=el("button",{class:"iconbtn","aria-pressed":String(on),
        "aria-label":(on? t.in_session : t.add_to)+": "+exName(e.code),
        style: on? "border-color:var(--accent);color:var(--accent);background:var(--accent-2)" : "",
        onClick:()=>{ on? PICK.delete(e.code) : PICK.add(e.code); render(); }}, on?"✓":"+");
      row.appendChild(add);
      row.appendChild(el("button",{class:"btn sm quiet",style:"width:auto;flex:0 0 auto",
        onClick:()=>startExercises([e.code], PICK_SCALE)}, t.start_session));
      box.appendChild(row);
    });
    root.appendChild(box);
  }

  /* build-your-own basket, pinned at the end */
  const bb=el("section",{class:"card"});
  bb.appendChild(el("p",{class:"eyebrow"},t.build_title));
  if(!PICK.size){
    bb.appendChild(el("p",{class:"muted"},
      isHe()? "סמנו + ליד תרגילים כדי להרכיב אימון משלכם."
            : "Tap + next to any exercises to assemble your own session."));
  } else {
    const chips=el("div",{class:"chips"});
    [...PICK].forEach(c=>chips.appendChild(el("span",{class:"chip"}, exName(c))));
    bb.appendChild(chips);
    bb.appendChild(el("p",{class:"eyebrow",style:"margin-top:8px"}, t.session_length));
    bb.appendChild(seg([[t.length_short,0.5],[t.length_normal,1],[t.length_long,1.8]],
      PICK_SCALE, v=>{ PICK_SCALE=v; render(); }));
    bb.appendChild(el("div",{style:"height:12px"}));
    bb.appendChild(el("button",{class:"btn", onClick:()=>startExercises([...PICK], PICK_SCALE)},
      `${t.start_selected} (${PICK.size} ${t.selected})`));
    bb.appendChild(el("div",{style:"height:8px"}));
    bb.appendChild(el("button",{class:"btn ghost", onClick:()=>{ PICK.clear(); render(); }}, t.clear_sel));
  }
  root.appendChild(bb);
}

/* ============================================================
   SCREEN — PROGRESS
   ============================================================ */
function screenProgress(root){
  const t=T(), st=L();
  root.appendChild(el("h2",{},t.tab_progress));

  if(st.slopeHistory.length===0 && st.wpmHistory.length===0 && st.totalTrials===0){
    root.appendChild(el("p",{class:"muted"},t.no_data));
    root.appendChild(el("button",{class:"btn",onClick:()=>open(assessmentScreen)},t.run_assessment));
    return;
  }

  // headline: slope
  const sh=st.slopeHistory;
  if(sh.length){
    const last=sh[sh.length-1], prev=sh.length>1?sh[sh.length-2]:null;
    const c=el("section",{class:"card"});
    c.appendChild(el("p",{class:"eyebrow"},t.slope));
    const m=el("div",{class:"metric"});
    m.appendChild(el("span",{class:"n"},String(last.slope)));
    m.appendChild(el("span",{class:"u"},t.slope_u));
    c.appendChild(m);
    if(prev){
      const d=last.slope-prev.slope;
      c.appendChild(el("p",{class:"muted"},
        (d<0? "▼ ":"▲ ")+Math.abs(d)+" "+(isHe()?"לעומת המדידה הקודמת":"since your last measurement")));
    }
    c.appendChild(spark(sh.map(x=>x.slope), true));
    c.appendChild(el("p",{class:"muted",style:"margin:8px 0 0"},t.slope_help));
    const pb=listenBtn(`${t.slope}: ${last.slope} ${t.slope_u}. ${t.slope_help}`);
    if(pb) c.appendChild(el("div",{class:"listenrow",style:"margin:12px 0 0"}, pb));
    root.appendChild(c);
  }

  // WPM + accuracy + comprehension
  const grid=el("div",{class:"metricgrid",style:"margin-bottom:16px"});
  const wp=st.wpmHistory;
  grid.appendChild(mini(t.reading_speed, wp.length? String(Math.round(wp[wp.length-1].wpm)) : "—", t.wpm));
  const acc = accOverall();
  grid.appendChild(mini(t.accuracy, acc===null?"—":Math.round(acc*100)+"%", ""));
  const ch=st.compHistory;
  grid.appendChild(mini(t.comprehension, ch.length? Math.round(ch[ch.length-1].pct*100)+"%":"—",""));
  const mastered = C().letters.filter(x=>letterMastery(x)>=0.8).length;
  grid.appendChild(mini(t.letters_mastered, mastered+"/"+C().letters.length, ""));
  root.appendChild(grid);

  if(wp.length>1){
    const c=el("section",{class:"card"});
    c.appendChild(el("p",{class:"eyebrow"},t.reading_speed));
    c.appendChild(spark(wp.map(x=>x.wpm), false));
    root.appendChild(c);
  }

  // letter mastery
  const lm=el("section",{class:"card"});
  lm.appendChild(el("p",{class:"eyebrow"},t.letter_mastery));
  const g=el("div",{class:"masterygrid"});
  C().letters.forEach(chx=>{
    const m=letterMastery(chx);
    const cell=el("div",{class:"cell", title:chx});
    cell.appendChild(el("b",{},chx));
    const bar=el("i",{}); bar.appendChild(el("span",{style:`width:${Math.round(m*100)}%`}));
    cell.appendChild(bar); g.appendChild(cell);
  });
  lm.appendChild(g);
  root.appendChild(lm);

  // error patterns
  const prof=errorProfile(120);
  const ec=el("section",{class:"card"});
  ec.appendChild(el("p",{class:"eyebrow"},t.err_title));
  if(!prof.length){
    ec.appendChild(el("p",{class:"muted"},t.err_none));
  } else {
    const dom=dominantError();
    if(dom){
      ec.appendChild(el("h3",{style:"margin-bottom:4px"}, t["e_"+dom.type]||dom.type));
      ec.appendChild(el("p",{style:"margin-bottom:14px"}, t["a_"+dom.type]||""));
    }
    prof.forEach(p=>{
      const row=el("div",{class:"pair"});
      row.appendChild(el("span",{}, t["e_"+p.type]||p.type));
      const bar=el("span",{style:"display:flex;align-items:center;gap:8px"});
      const track=el("i",{style:"display:block;width:76px;height:6px;border-radius:3px;background:var(--paper-3)"});
      track.appendChild(el("span",{style:`display:block;height:100%;border-radius:3px;background:var(--accent);width:${Math.round(p.pct*100)}%`}));
      bar.appendChild(track);
      bar.appendChild(el("b",{class:"ct"}, String(p.n)));
      row.appendChild(bar);
      ec.appendChild(row);
    });
  }
  root.appendChild(ec);

  // confusions
  const pairs=[];
  for(const a in st.confusion) for(const b in st.confusion[a]) pairs.push([a,b,st.confusion[a][b]]);
  pairs.sort((x,y)=>y[2]-x[2]);
  if(pairs.length){
    const cf=el("section",{class:"card"});
    cf.appendChild(el("p",{class:"eyebrow"},t.confusions));
    pairs.slice(0,6).forEach(([a,b,n])=>{
      cf.appendChild(el("div",{class:"pair"},

/* Tiny sparkline. lowerBetter flips the sense of the trend colour. */
function spark(vals, lowerBetter){
  const w=320,h=56,p=6;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`); svg.setAttribute("class","spark");
  svg.setAttribute("preserveAspectRatio","none"); svg.setAttribute("aria-hidden","true");
  if(vals.length<2){
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",p);line.setAttribute("x2",w-p);line.setAttribute("y1",h/2);line.setAttribute("y2",h/2);
    line.setAttribute("stroke","var(--rule)");line.setAttribute("stroke-width","1");
    svg.appendChild(line); return svg;
  }
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), h-p-((v-mn)/rg)*(h-2*p)]);
  const d="M"+pts.map(q=>q.map(z=>z.toFixed(1)).join(",")).join(" L");
  const improving = lowerBetter ? vals[vals.length-1]<vals[0] : vals[vals.length-1]>vals[0];
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",d); path.setAttribute("fill","none");
  path.setAttribute("stroke", improving?"var(--good)":"var(--ink-3)");
  path.setAttribute("stroke-width","2.5"); path.setAttribute("stroke-linejoin","round");
  path.setAttribute("stroke-linecap","round");
  svg.appendChild(path);
  pts.forEach(q=>{ const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",q[0]);c.setAttribute("cy",q[1]);c.setAttribute("r","3");
    c.setAttribute("fill", improving?"var(--good)":"var(--ink-3)"); svg.appendChild(c); });
  return svg;
}

/* ============================================================
   SESSION PLANNER
   Composes blocks for the time budget, weighted to the stage and
   to what the person is currently worst at.
   ============================================================ */
const EXERCISES = [
  {code:"letter_flash", stage:1, n:12, grade:"x"},
  {code:"letter_find",  stage:1, n:10, grade:"v"},
  {code:"trace",        stage:1, n:4,  grade:"v"},
  {code:"word_flash",   stage:2, n:12, grade:"x"},
  {code:"word_pick",    stage:2, n:10, grade:"v"},
  {code:"root",         stage:2, n:8,  grade:"x", only:"he"},
  {code:"finals",       stage:2, n:8,  grade:"x", only:"he"},
  {code:"case",         stage:2, n:8,  grade:"x", only:"en"},
  {code:"sentence",     stage:3, n:6,  grade:"v"},
  {code:"mor",          stage:4, n:1,  grade:"v"},
  {code:"real",         stage:5, n:1,  grade:"v"}
];
const catalogue = () => EXERCISES.filter(e=>!e.only || e.only===S.lang);

/* Launch exactly what the person asked for, nothing bundled around it. */
function startExercises(codes, scale){
  const by={}; catalogue().forEach(e=>by[e.code]=e);
  const blocks = codes.filter(c=>by[c]).map(c=>({
    kind:c, n: Math.max(1, Math.round(by[c].n * (scale||1)))
  }));
  if(!blocks.length) return;
  startSession({blocks, minutes:0, stage:L().stage, custom:true});
}

function planSession(minutes, forceStage){
  const st=L(); const stage = forceStage || st.stage;
  const dom = dominantError();
  // an unrelated-answer pattern is a fatigue signal, so shorten rather than drill
  const mins = minutes || ((dom && dom.type==="unrelated") ? 8 : 12);
  const blocks=[];
  const push=(kind,n,extra={})=>blocks.push(Object.assign({kind,n},extra));

  if(stage===1){
    push("letter_flash", mins<=3?6:12);
    push("letter_find", mins<=3?4:10);
    if(mins>3) push("trace", 3);
  } else if(stage===2){
    push("letter_flash", 6);
    push("word_flash", mins<=3?6:12);
    push("word_pick", mins<=3?4:8);
    if(mins>3) push(isHe()?"root":"case", 6);
    if(mins>3 && isHe()) push("finals", 5);
  } else if(stage===3){
    push("word_flash", 8);
    push("sentence", mins<=3?3:6);
    if(mins>3) push("word_pick", 6);
  } else if(stage===4){
    push("word_flash", 6);
    push("mor", 1);
    push("sentence", 4);
  } else {
    push("mor", 1);
    push("real", 1);
    push("word_flash", 6);
  }
  /* Targeted remediation: the dominant error class earns its own block. */
  if(dom && mins>3){
    const add = {
      similar_letter:"letter_find",
      final_form: isHe()? "finals" : null,
      letter_case: isHe()? null : "case",
      morphology: isHe()? "root" : "word_pick",
      letter_order:"word_pick",
      truncation:"word_pick",
      word_onset:"letter_find",
      length:"word_pick"
    }[dom.type];
    if(add){
      const existing = blocks.find(b=>b.kind===add);
      if(existing) existing.n += 4; else blocks.splice(1,0,{kind:add, n:6});
    }
  }
  return {blocks, minutes:mins, stage, focus: dom? dom.type : null};
}

/* ============================================================
   SESSION RUNNER
   One state machine drives every exercise type. Every trial logs
   latency, correctness and the item, because those three things
   are the whole measurement layer.
   ============================================================ */
let SESS=null;

/* A session that dies to a screen lock or an accidental refresh takes its
   partial data with it, so the plan is parked where it can be picked up. */
/* Write (or update) this session's row now, rather than hoping it ends cleanly. */
function commitSession(reason){
  if(!SESS) return;
  const st=L(), s=SESS;
  const row = {t:s.t0, sec:Math.round((Date.now()-s.t0)/1000), n:s.n, k:s.correct,
               ended:reason||"in_progress", id:s.id};
  const i = st.sessions.findIndex(x=>x.id===s.id);
  if(i>=0) st.sessions[i]=row; else st.sessions.push(row);
  st.totalTrials = (st.committedTrials||0) + s.n;
  return row;
}
function sealSession(){
  const st=L();
  st.committedTrials = st.totalTrials;
}
function parkSession(){
  if(!SESS) return;
  commitSession("in_progress");
  S.pending = {plan:SESS.plan, bi:SESS.bi, ti:SESS.ti, n:SESS.n, correct:SESS.correct,
               id:SESS.id, t0:SESS.t0, lang:S.lang, at:Date.now()};
  saveState();
}
function clearParked(){ if(S.pending){ delete S.pending; saveState(); } }
function resumeSession(){
  const p=S.pending; if(!p) return false;
  SESS = {plan:p.plan, bi:p.bi, ti:p.ti, t0:p.t0||Date.now(), id:p.id,
          trials:[], correct:p.correct||0, n:p.n||0, ended:null,
          rtWindow:[], warned:false, letterBag:[], wordBag:[], said:{}};
  clearParked(); requestWake();
  open(sessionScreen);
  return true;
}

/* Reading a passage can take minutes with no touch input; without this the
   screen sleeps mid-read and the timer keeps counting. */
let WAKE=null;
async function requestWake(){
  try{ if(navigator.wakeLock && !WAKE) WAKE = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseWake(){ try{ WAKE && WAKE.release(); }catch(e){} WAKE=null; }

function startSession(plan){
  requestWake();
  SESS = {
    plan, bi:0, ti:0, t0:Date.now(),
    id: "s"+Date.now().toString(36),
    trials:[], correct:0, n:0, ended:null,
    rtWindow:[], warned:false,
    letterBag:[], wordBag:[]
  };
  markDay();
  open(sessionScreen);
}
function sessEnd(reason){
  const st=L(), s=SESS;
  releaseWake(); clearParked();
  const row = commitSession(reason);
  sealSession();
  const sec = row.sec;
  addXP(Math.round(s.n*4 + sec/6));
  maybeAdvanceStage();
  flushState();
  open(()=>summaryScreen(sec, reason));
}
/* Advancement is criterion-based: mastery of what the stage trains,
   not time served. */
function maybeAdvanceStage(){
  const st=L();
  if(st.stage===1){
    const m=C().letters.filter(x=>letterMastery(x)>=0.8).length;
    if(m >= Math.ceil(C().letters.length*0.8)) st.stage=2;
  } else if(st.stage===2){
    const ws=Object.values(st.wordStats); const seen=ws.length;
    const acc=ws.reduce((a,b)=>a+b.k,0)/Math.max(1,ws.reduce((a,b)=>a+b.n,0));
    if(seen>=40 && acc>=0.85) st.stage=3;
  } else if(st.stage===3){
    const c=st.compHistory.slice(-8);
    if(c.length>=6 && c.reduce((a,b)=>a+b.pct,0)/c.length >= 0.7) st.stage=4;
  } else if(st.stage===4){
    const reads=Object.values(st.passageReads).reduce((a,b)=>a+b,0);
    const comp=st.compHistory.slice(-8);
    if(reads>=12 && comp.length>=4 && comp.reduce((a,b)=>a+b.pct,0)/comp.length >= 0.7) st.stage=5;
  }
}
function logTrial(o){
  const s=SESS; s.n++; if(o.ok) s.correct++;
  if(o.kind){ const es=L().exerciseStats, e=es[o.kind]||(es[o.kind]={n:0,k:0}); e.n++; if(o.ok) e.k++; }
  if(s.n % 5 === 0) commitSession("in_progress");
  // classify BEFORE recording, or the err column exports empty
  if(o.ok===false && o.item!==undefined && "resp" in o){
    const cls0 = noteError(o.item, o.resp, o.lang);
    if(cls0) o.err = cls0.type;
  }
  recordTrial({
    ts: Date.now(),
    session: s.id,
    lang: S.lang,
    seq: s.n,
    minute: +((Date.now()-s.t0)/60000).toFixed(2),   // position in session: fatigue covariate
    kind: o.kind || "",
    item: o.item===undefined? "" : String(o.item),
    len: o.item!==undefined && o.item!==null ? [...String(o.item)].length : "",
    resp: o.resp===undefined||o.resp===null? "" : String(o.resp),
    ok: o.ok===true ? 1 : 0,
    rt: o.rt===undefined? "" : o.rt,
    exposure: o.exposure===undefined? "" : o.exposure,
    err: o.err || "",
    nikud: (S.lang==="he" && S.look.nikud) ? 1 : 0,
    font: S.look.font, size: S.look.size, track: S.look.track, theme: S.look.theme,
    stage: L().stage
  });
  s.trials.push(o);
  s.rtWindow.push({ok:o.ok, rt:o.rt||0});
  if(s.rtWindow.length>26) s.rtWindow.shift();
}
/* Fatigue: compare the back half of the rolling window with the front. */
function fatigued(){
  const w=SESS.rtWindow;
  if(SESS.warned || w.length<18) return false;
  const half=Math.floor(w.length/2);
  const a=w.slice(0,half), b=w.slice(half);
  const accA=a.filter(x=>x.ok).length/a.length, accB=b.filter(x=>x.ok).length/b.length;
  const rtA=a.reduce((s,x)=>s+x.rt,0)/a.length, rtB=b.reduce((s,x)=>s+x.rt,0)/b.length;
  return (accB < accA-0.2 && accB<0.65) || (rtA>0 && rtB > rtA*1.55);
}

function sessionScreen(){
  const s=SESS;
  if(!s) { return el("div",{class:"screen"}); }
  const block = s.plan.blocks[s.bi];
  if(!block){ later(()=>sessEnd("completed"),0); return el("div",{class:"screen"}); }
  if(s.ti>=block.n){ s.bi++; s.ti=0; parkSession(); return sessionScreen(); }
  if(fatigued()){ s.warned=true; return breakScreen(); }

  const wrap=el("div",{class:"screen",style:"padding-top:14px"});
  wrap.appendChild(sessionHeader());
  const host=el("div",{});
  wrap.appendChild(host);
  const runner = {
    letter_flash: runLetterFlash, letter_find: runLetterFind, trace: runTrace,
    word_flash: runWordFlash, word_pick: runWordPick, root: runRoot,
    finals: runFinals, case: runCase, sentence: runSentence,
    mor: runMor, real: runReal
  }[block.kind];
  runner(host, ()=>{ s.ti++; open(sessionScreen); });
  return wrap;
}
function sessionHeader(){

/* ---------- session summary ---------- */
function summaryScreen(sec, reason){
  const t=T(), s=SESS, st=L();
  const w=el("div",{class:"screen"});
  w.appendChild(el("h2",{style:"margin-top:20px"},t.sess_done));
  const grid=el("div",{class:"metricgrid",style:"margin-bottom:18px"});
  grid.appendChild(mini(t.time, fmtT(sec), ""));
  grid.appendChild(mini(t.accuracy, s.n? Math.round(100*s.correct/s.n)+"%":"—",""));
  w.appendChild(grid);

  const c=el("section",{class:"card"});
  c.appendChild(el("p",{class:"eyebrow"},t.what_moved));
  const lines=[];
  const byLen={};
  s.trials.filter(x=>x.kind==="word_flash"&&x.ok).forEach(x=>{
    (byLen[x.len]=byLen[x.len]||[]).push(x.rt);
  });
  Object.keys(byLen).sort().forEach(k=>{
    const a=byLen[k]; const avg=Math.round(a.reduce((x,y)=>x+y,0)/a.length);
    lines.push(isHe()? `מילים של ${k} אותיות: ${avg} מילישניות בממוצע`
                     : `${k}-letter words: ${avg} ms on average`);
  });
  const todayErr={};
  s.trials.forEach(x=>{ if(x.err) todayErr[x.err]=(todayErr[x.err]||0)+1; });
  const topErr=Object.entries(todayErr).filter(([k])=>k!=="unsure").sort((a,b)=>b[1]-a[1])[0];
  if(topErr) lines.push((t["e_"+topErr[0]]||topErr[0])+" — "+topErr[1]);
  const errs={};
  s.trials.forEach(x=>{ if(!x.ok && x.item) errs[x.item]=(errs[x.item]||0)+1; });
  const worst=Object.entries(errs).sort((a,b)=>b[1]-a[1])[0];
  if(worst) lines.push(isHe()? `${worst[0]} — ${worst[1]} טעויות היום`
                             : `${worst[0]} — ${worst[1]} errors today`);
  if(!lines.length) lines.push(t.nothing_yet);
  lines.forEach(l=>c.appendChild(el("div",{class:"pair"}, el("span",{},l))));
  if(worst) c.appendChild(el("p",{class:"muted",style:"margin-top:12px"}, `${t.tomorrow} ${worst[0]}.`));
  const spokenSum = `${t.sess_done}. ${t.time} ${fmtT(sec)}. ${t.accuracy} ${s.n?Math.round(100*s.correct/s.n):0} ${isHe()?"אחוז":"percent"}. ${lines.join(". ")}`;
  const sb=listenBtn(spokenSum); if(sb) c.appendChild(el("div",{class:"listenrow",style:"margin:12px 0 0"}, sb));
  announce(spokenSum);
  w.appendChild(c);

  if(reason==="fatigue"){
    w.appendChild(el("div",{class:"note"},
      isHe()? "סיימנו מוקדם כי הקצב ירד. להגיע ולהתעייף זה בדיוק מה שצריך."
            : "We stopped early because your pace dropped. Turning up and getting tired is exactly the work."));
  }
  w.appendChild(el("button",{class:"btn", onClick:()=>{ SESS=null; go("today"); }}, t.done));
  return w;
}

/* ============================================================
   EXERCISE RUNNERS
   ============================================================ */
let TIMERS=[];
function later(fn,ms){ const id=setTimeout(fn,ms); TIMERS.push(id); return id; }
function clearTimers(){ TIMERS.forEach(id=>{clearTimeout(id);clearInterval(id);}); TIMERS=[]; }

function makeStage(){
  const s=el("div",{class:"stage"});
  s.appendChild(el("div",{class:"reg1"})); s.appendChild(el("div",{class:"reg2"}));
  const inner=el("div",{}); s.appendChild(inner); s._in=inner;
  return s;
}
function maskFor(text){ return "▨".repeat(Math.max(1, [...text].length)); }

/* Present a stimulus for `ms`, then mask it. Calls back with onset time. */
function flash(stageEl, text, ms, cls, after){
  TTS.stop();                 // speech during a timed trial corrupts the latency
  const inner=stageEl._in;
  inner.innerHTML="";
  inner.appendChild(el("div",{class:"fixation"},"+"));
  later(()=>{
    inner.innerHTML="";
    inner.appendChild(el("div",{class:"stim "+(cls||"")},text));
    const onset=performance.now();
    later(()=>{
      inner.innerHTML="";
      inner.appendChild(el("div",{class:"mask"}, maskFor(text)));
      later(()=>{ inner.innerHTML=""; after(onset); }, 220);
    }, ms);
  }, 420);
}

function choiceGrid(items, correctItem, onPick, opts={}){
  const t=T();
  const show = opts.render || (x=>String(x));
  const g=el("div",{class:"choices"});
  items.forEach(it=>{
    const b=el("button",{class:"choice"+(opts.wide?" wide":""), onClick:()=>{
      const ok = it===correctItem;
      [...g.children].forEach(c=>{ c.disabled=true; });
      b.classList.add(ok?"correct":"wrong");
      if(!ok) [...g.children].forEach(c=>{ if(c.textContent===show(correctItem)) c.classList.add("reveal"); });
      later(()=>onPick(it, ok), ok?380:900);
    }}, show(it));
    g.appendChild(b);
  });
  const ns=el("button",{class:"choice wide", style:"font-size:16px;color:var(--ink-3)", onClick:()=>{
    [...g.children].forEach(c=>c.disabled=true);
    onPick(null,false);
  }}, t.not_sure);
  g.appendChild(ns);
  return g;
}

/* --- tactile-kinesthetic tracing. Scored against the actual glyph
       pixels: coverage of the letter, plus how much of the drawn
       path stayed on it. --- */
function runTrace(host, done){
  const t=T();
  const target = rnd(weakLetters(1));
  host.appendChild(el("p",{class:"eyebrow center"},t.trace_title));
  const tlb=listenBtn(t.trace_title,{compact:true});
  if(tlb) host.appendChild(el("div",{class:"listenrow",style:"justify-content:center"}, tlb));
  announceOnce("trace", t.trace_title);
  const size = Math.min(300, (window.innerWidth||360)-56);
  const wrap=el("div",{class:"stage"}); wrap.appendChild(el("div",{class:"reg1"})); wrap.appendChild(el("div",{class:"reg2"}));
  const cv=el("canvas",{class:"trace", width:size, height:size});
  wrap.appendChild(cv); host.appendChild(wrap);

  const ctx=cv.getContext && cv.getContext("2d");
  const off=document.createElement("canvas"); off.width=size; off.height=size;
  const octx=off.getContext && off.getContext("2d");
  if(!ctx || !octx){   // canvas unavailable: fall back to naming the letter
    wrap.removeChild(cv);
    wrap.appendChild(el("div",{class:"stim"},target));
    host.appendChild(el("button",{class:"btn",style:"margin-top:12px",onClick:()=>{
      noteLetter(target,true,1200); logTrial({kind:"trace",item:target,ok:true,rt:1200});
      saveState(); done();
    }}, t.trace_next));
    return;
  }
  const fontPx=Math.round(size*0.78);
  const setFont=c=>{ c.font=`500 ${fontPx}px ${getComputedStyle(document.documentElement).getPropertyValue("--read-font")}`;
                     c.textAlign="center"; c.textBaseline="middle"; };
  setFont(octx); octx.fillStyle="#000"; octx.fillText(target, size/2, size/2);
  const ink=octx.getImageData(0,0,size,size).data;

  const step=4, gw=Math.floor(size/step);
  const inkCells=[]; const inkSet=new Set();
  for(let y=0;y<gw;y++) for(let x=0;x<gw;x++){
    const a=ink[((y*step)*size+(x*step))*4+3];
    if(a>60){ inkCells.push(y*gw+x); inkSet.add(y*gw+x); }
  }
  const drawGhost=()=>{
    ctx.clearRect(0,0,size,size);
    setFont(ctx);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--rule");
    ctx.fillText(target, size/2, size/2);
  };
  drawGhost();

  let drawing=false, pts=[], touched=new Set(), onInk=0, total=0;
  const posOf=e=>{ const r=cv.getBoundingClientRect();
    return [ (e.clientX-r.left)*size/r.width, (e.clientY-r.top)*size/r.height ]; };
  const mark=(x,y)=>{
    total++;
    const gx=Math.floor(x/step), gy=Math.floor(y/step);
    let hit=false;
    for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
      const k=(gy+dy)*gw+(gx+dx);
      if(inkSet.has(k)){ touched.add(k); hit=true; }
    }
    if(hit) onInk++;
  };
  cv.addEventListener("pointerdown",e=>{ drawing=true; if(cv.setPointerCapture) try{cv.setPointerCapture(e.pointerId)}catch(_){}
    const p=posOf(e); pts=[p]; mark(p[0],p[1]);
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent");
    ctx.lineWidth=Math.max(10,size*0.055); ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); });
  cv.addEventListener("pointermove",e=>{ if(!drawing) return;
    const p=posOf(e); mark(p[0],p[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); });
  const up=()=>{ drawing=false; };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);

  const score=el("p",{class:"muted center",style:"min-height:26px"});
  host.appendChild(score);
  const row=el("div",{class:"btnrow"});
  row.appendChild(el("button",{class:"btn ghost", onClick:()=>{
    touched=new Set(); onInk=0; total=0; score.textContent=""; drawGhost();
  }}, t.trace_again));
  row.appendChild(el("button",{class:"btn", onClick:()=>{
    const coverage = inkCells.length? touched.size/inkCells.length : 0;
    const precision = total? onInk/total : 0;
    const sc = clamp(coverage*0.65 + precision*0.35, 0, 1);
    const ok = sc>=0.5;
    score.textContent = `${t.trace_score}: ${Math.round(sc*100)}%`;
    if(S.voice && S.voice.on) TTS.speak(letterName(target));
    noteLetter(target, ok, 1200);
    logTrial({kind:"trace", item:target, ok, rt:1200, score:Math.round(sc*100)});
    saveState(); later(done, 700);
  }}, t.trace_next));
  host.appendChild(row);
}

/* --- word in brief exposure, adaptive --- */
function runWordFlash(host, done){
  const t=T(), st=L();
  if(!SESS.wordBag.length){
    const stage=st.stage;
    const dom = dominantError();
    let lens = stage<=2? [3,3,4,4,5] : stage===3? [4,5,5,6,6] : [5,6,6,7,8];
    if(dom && (dom.type==="truncation" || dom.type==="length")){
      lens = lens.map(n=>Math.max(3, n-1));   // pull back within reach
    }
    SESS.wordBag = shuffle(lens.map(n=>rnd(C().words[n]||C().words[4])));
  }
  const target = SESS.wordBag.pop();
  const ms = st.exposure.word;
  const stage=makeStage(); host.appendChild(stage);
  const prompt=el("p",{class:"muted center",style:"min-height:24px"});
  host.appendChild(prompt);
  flash(stage, displayWord(target), ms, "word", onset=>{
    prompt.textContent=t.which_word;
    announceOnce("wf", t.which_word);
    const opts=shuffle([target, ...wordDistractors(target,3)]);
    host.appendChild(choiceGrid(opts, target, (pick,ok)=>{
      const rt=performance.now()-onset;
      const ws=st.wordStats; const w=ws[target]||(ws[target]={n:0,k:0});
      w.n++; if(ok) w.k++;
      stair("word", ok);
      logTrial({kind:"word_flash", item:target, resp:pick, ok, rt:Math.round(rt),
                len:[...target].length, exposure:ms});
      saveState(); done();
    }, {render:displayWord}));
  });
}
